[package]
name = "rclone-browser"
version = "2.0.2"
description = "A modern desktop browser for rclone remotes"
authors = ["Rclone Browser contributors"]
edition = "2024"
license = "MIT"
repository = "https://github.com/kapitainsky/RcloneBrowser"

[lib]
name = "rclone_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rclone-browser-shared = { path = "../../../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
plist = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1", features = ["io-util", "process", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
